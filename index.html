<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#252729" />
    <script>
      // Pre-paint background hint: the full token set is applied by the theme
      // store once the bundle runs, but the empty body would otherwise flash
      // the default background on a cold load with a saved non-default theme.
      // The theme test keeps this map in sync with THEMES in
      // src/lib/theme/palettes.ts.
      (function () {
        var inks = {
          'warm-graphite': '#252729',
          'misty-blue': '#1F262B',
          'coral-dusk': '#2B2523',
        };
        var theme = 'warm-graphite';
        try {
          var saved = localStorage.getItem('pixel-sort-theme');
          if (saved && typeof inks[saved] === 'string') theme = saved;
        } catch (error) {
          // Storage can be unavailable; the default theme is fine.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.setProperty('--color-ground', inks[theme]);
      })();
    </script>
    <meta
      name="description"
      content="Turn an image into a sorting-algorithm playground. Choose a block size, pick an algorithm, and watch the original composition reconstruct itself — entirely in your browser."
    />
    <title>Pixel Sort — Visualizer</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div
        style="
          padding: 24px;
          font-family: system-ui, sans-serif;
          color: #eae2d8;
          background: #252729;
        "
      >
        Pixel Sort needs JavaScript to decode, shuffle, and sort the image locally in your browser.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
